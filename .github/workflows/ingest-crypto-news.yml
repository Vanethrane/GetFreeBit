# Hourly crypto news ingest — add stories posted since the last search, then
# rebuild the static export so GitHub Pages serves the new /news entries.

name: Ingest crypto news

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-crypto-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Ingest new crypto stories since last search
        run: node scripts/ingest-crypto-news.mjs

      - name: Detect wire changes
        id: wire
        run: |
          if git diff --quiet -- src/data/news-wire.json src/data/news-wire-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new stories to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and rebuild static site
        if: steps.wire.outputs.changed == 'true'
        run: |
          npm ci
          npm run build:pages

      - name: Commit and push if changed
        if: steps.wire.outputs.changed == 'true'
        run: |
          git config user.name "getfreebit-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news-wire.json src/data/news-wire-state.json \
            news/ sitemap.xml robots.txt _next/ index.html index.txt \
            about/ cards/ contact/ exchanges/ faucets/ guides/ how-to/ \
            privacy/ terms/ tools/ 404.html 404/ || true
          if git diff --staged --quiet; then
            echo "Nothing staged after rebuild."
            exit 0
          fi
          git commit -m "Add crypto news wire stories."
          git push
