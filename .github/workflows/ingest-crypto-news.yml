# Ingest one crypto news wire story every few hours and push to main
# so Cloudflare Pages (or GitHub Pages) rebuilds with the new /news entry.

name: Ingest crypto news

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-crypto-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ingest latest wire story
        run: node scripts/ingest-crypto-news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "getfreebit-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news-wire.json
          if git diff --staged --quiet; then
            echo "No news-wire changes."
            exit 0
          fi
          git commit -m "Add crypto news wire story."
          git push
